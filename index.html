<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izzy - Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="boot">
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>
  <div class="disc-flight" id="discFlight"></div>

  <div class="room">
    <div class="room-glow"></div>
    <div class="scene">
      <div class="tv" id="tv">
        <div class="tv-brand-bar"><span class="tv-brand">Izzy</span><span class="tv-model">PT-2000</span></div>
        <div class="tv-body-inner">
          <div class="screen-bezel">
            <div class="screen" id="screen">
              <canvas id="ps2Canvas"></canvas>
              <div class="s-boot" id="sboot">
                <div>
                  <div class="ps2-shapes">
                    <span class="ps2-sq" id="bsq">&#9632;</span><span class="ps2-tr" id="btr">&#9650;</span>
                    <span class="ps2-cr" id="bcr">&#10005;</span><span class="ps2-ci" id="bci">&#9679;</span>
                  </div>
                  <div class="ps2-wordmark" id="bword">IZZY<sup>2</sup></div>
                </div>
                <div class="boot-tagline" id="btagline">PORTFOLIO SYSTEM</div>
                <div class="boot-bar-wrap" id="bbarwrap"><div class="boot-bar" id="bbar"></div></div>
                <div class="boot-skip" id="bootSkip">[ SKIP ]</div>
                <div class="audio-hint" id="audioHint">CLICK ANYWHERE TO ENABLE AUDIO</div>
              </div>
              <div class="s-menu" id="smenu">
                <div class="xmb-cats" id="xmbCats"></div>
                <div class="xmb-row-wrap"><div class="xmb-row" id="xmbRow"></div></div>
                <div class="xmb-info-bar">
                  <div class="xmb-title" id="xmbTitle">-</div>
                  <div class="xmb-meta" id="xmbMeta"></div>
                  <div class="xmb-hint">[ ENTER ] PLAY &nbsp;.&nbsp; [ arrow keys ] BROWSE</div>
                </div>
              </div>
              <div class="s-loading" id="sloading">
                <div class="loading-disc"></div>
                <div class="loading-label">LOADING</div>
              </div>
              <div class="scanlines"></div>
              <div class="screen-vignette"></div>
              <div class="screen-glare"></div>
              <div class="screen-flash" id="screenFlash"></div>
            </div>
          </div>
          <div class="tv-knobs"><div class="tv-knob"></div><div class="tv-knob"></div></div>
        </div>
        <div class="tv-bottom-strip">
          <div class="tv-speaker-dots" id="speakerDots"></div>
          <div class="tv-right-controls">
            <button class="audio-btn" id="audioBtn" title="Toggle Audio">&#9834;</button>
            <div class="tv-power-led" id="tvLed"></div>
          </div>
        </div>
        <div class="tv-legs"><div class="tv-leg"></div><div class="tv-leg"></div></div>
      </div>

      <div class="console">
        <div class="console-body">
          <div class="con-ports"><div class="con-port"></div><div class="con-port"></div></div>
          <div class="con-mc-slots"><div class="con-mc"></div><div class="con-mc"></div></div>
          <div class="con-disc-area">
            <div class="con-disc-slot" id="discSlot"></div>
            <div class="con-disc-label">DISC</div>
          </div>
          <div class="con-right">
            <button class="con-btn" id="powerBtn" title="Power">&#9211;</button>
            <button class="con-btn" title="Reset">&#8634;</button>
            <div class="con-led" id="conLed"></div>
            <div class="con-wordmark">PS2</div>
          </div>
        </div>
      </div>

      <div class="game-shelf">
        <div class="shelf-label">&#9650; INSERT DISC TO PLAY</div>
        <div class="shelf-cases" id="shelfCases"></div>
        <div class="shelf-board"></div>
      </div>

      <!-- Social links below the shelf -->
      <div class="social-bar" id="socialBar"></div>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal-bd" id="modal">
    <div class="modal-inner">
      <div class="modal-header">
        <div class="modal-np">
          <span class="modal-ps-icon">&#9654; NOW PLAYING</span>
          <span class="modal-cat-tag" id="mCatTag"></span>
          <span class="modal-title-display" id="mTitle"></span>
        </div>
        <button class="modal-eject-btn" id="modalClose">&#9167; EJECT</button>
      </div>
      <div class="modal-video-area" id="mVideoArea">
        <div class="modal-ph" id="mPh">
          <div class="modal-ph-icon">&#9654;</div>
          <p>Video coming soon</p>
          <small>Add your embed URL to the project data</small>
        </div>
      </div>
      <div class="modal-scroll">
        <div class="modal-info-grid">
          <div class="info-block">
            <div class="info-label">About This Project</div>
            <div class="info-text" id="mDesc"></div>
          </div>
          <div class="info-block">
            <div class="info-label">What I Did</div>
            <div class="info-text" id="mRole"></div>
          </div>
          <div class="info-block">
            <div class="info-label">Made For</div>
            <div class="info-text" id="mClient"></div>
          </div>
        </div>
        <div class="bts-strip" id="btsStrip">
          <div class="bts-strip-label">Behind the Scenes</div>
          <div class="bts-photos" id="btsPhotos"></div>
        </div>
        <div class="modal-social" id="modalSocial">
          <div class="modal-social-left" id="mYear"></div>
          <div class="modal-social-links" id="modalSocialLinks"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- BTS Lightbox -->
  <div class="lb" id="lb">
    <button class="lb-close" id="lbClose">&#10005; CLOSE</button>
    <img class="lb-img" id="lbImg" src="" alt="Behind the scenes" />
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
